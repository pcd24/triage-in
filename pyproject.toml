[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-in"
version = "0.1.0"
description = "Multi-task triage (category, sentiment, urgency) for code-mixed Indian customer complaints, from TF-IDF baseline to an on-device TFLite student."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Charu Datta" }]
license = { text = "MIT" }
# Core deps shared by BOTH environments (no torch / tensorflow here).
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "regex==2026.9.29",
]

[project.optional-dependencies]
# PyTorch environment: data building, baseline, teacher, LLM evaluation.
torch = [
    "torch==2.14.1",
    "transformers==5.21.0",
    "peft==0.21.2",
    "datasets==5.1.0",
    "accelerate==1.15.0",
    "python-dotenv==1.2.4",
    "joblib==1.6.0",
    "google-genai==2.33.0",
]
# TensorFlow environment: student, distillation, TFLite conversion.
tf = [
    "tensorflow==2.21.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
    "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "torch: needs the PyTorch environment",
    "tf: needs the TensorFlow environment",
]
